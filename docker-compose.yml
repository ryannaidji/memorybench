services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
  api:
    build: .
    depends_on: [ollama]
    environment:
      LLM_MODEL: qwen2.5:3b
      EMBED_MODEL: nomic-embed-text
    volumes: [data:/data]
    ports: ["8000:8000"]
volumes:
  ollama:
  data:
